[project]
name = "financial-intelligence-deal-analytics"
version = "0.1.0"
description = "Financial Intelligence Pipeline — Projet 1/3 (SQL/PostgreSQL)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "yfinance>=0.2.40",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
