services:
  postgres:
    image: postgres:16
    container_name: fida_postgres
    environment:
      POSTGRES_USER: fida
      POSTGRES_PASSWORD: fida_dev_password
      POSTGRES_DB: financial_intelligence
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fida -d financial_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
